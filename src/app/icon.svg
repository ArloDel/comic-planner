<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cp-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="cp-page" x1="18" y1="16" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#cp-bg)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Back comic volume layer -->
  <rect x="22" y="13" width="24" height="34" rx="4" transform="rotate(6 22 13)" fill="#a5b4fc" fill-opacity="0.35" />

  <!-- Main comic book cover -->
  <rect x="17" y="15" width="26" height="34" rx="4.5" fill="url(#cp-page)" />

  <!-- Book spine groove -->
  <path d="M22 15.5V48.5" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />

  <!-- Manga panel lines inside cover -->
  <rect x="25.5" y="20" width="13.5" height="8" rx="1.75" fill="#4f46e5" fill-opacity="0.16" />
  <rect x="25.5" y="30.5" width="6" height="9" rx="1.5" fill="#4f46e5" fill-opacity="0.12" />
  <rect x="33" y="30.5" width="6" height="9" rx="1.5" fill="#4f46e5" fill-opacity="0.12" />

  <!-- Bookmark ribbon at top right of book -->
  <path d="M35.5 15V24.5L38 22.7L40.5 24.5V15H35.5Z" fill="#4f46e5" />

  <!-- Planner check badge (bottom right) -->
  <circle cx="43" cy="44" r="9" fill="#312e81" />
  <circle cx="43" cy="44" r="7.5" fill="#ffffff" />
  <path d="M39.8 44.1L42.1 46.4L46.5 41.8" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
