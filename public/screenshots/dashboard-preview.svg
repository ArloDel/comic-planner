  <text x="44" y="139" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#475569">Katalog</text>
  <text x="44" y="177" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#475569">Rencana</text>
